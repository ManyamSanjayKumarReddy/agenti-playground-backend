services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      INTERNAL_SECRET: ${INTERNAL_SECRET:-change-me-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      LANGSMITH_TRACING: "false"
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-agentbay}
    volumes:
      # Scratch space for generated projects before handoff to ZeroTo
      - generated_projects:/app/generated_projects

volumes:
  generated_projects:
